<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>주소 변경 안내</title>
<style>:root{--brand:#1f3f99;--tx:#1b2330;--tx2:#4a5568;--line:#dde2ea;--bg:#f5f7fa}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:grid;place-items:center;padding:16px}main{max-width:460px;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px 28px}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;color:var(--tx2);line-height:1.6;margin:0 0 18px}a{display:block;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;color:var(--brand);font-weight:700;text-decoration:none}a:hover,a:focus-visible{border-color:var(--brand)}a span{display:block;font-weight:400;color:var(--tx2);font-size:13px;margin-top:2px}</style></head>
